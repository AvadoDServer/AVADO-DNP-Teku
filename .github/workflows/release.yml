name: Release
# Publishes to the STAGING store every network whose version is new on the
# default branch (replaces AvadoDServer/ci-release-action for this repo):
# the build the PR checks tested (or a new AVADOSDK build if there is none),
# its hash recorded in package_variants/<network>/releases.json and in a
# commit "Release <name> <version>", then store.setPackageHash per package and
# one store.releaseStore, with the RPC_TOKEN secret, like ci-release-action.
# No new version: nothing is published. No RPC_TOKEN: a dry run.
# Production stays the owner's click in editstore.
# Details: .github/pipeline/release.mjs.
on:
  push:
    branches: [main, master]
  workflow_dispatch: # the gate starts it after merging
    inputs:
      dry_run:
        description: 'Only show what would be published'
        type: boolean
        default: false

permissions:
  contents: write # the "Release <name> <version>" commit
  actions: read # the tested build's record
  issues: write # reports a failure of this workflow to the owner

concurrency:
  group: release
  cancel-in-progress: false

env:
  IPFS_API: ${{ vars.IPFS_PROVIDER == 'local' && 'http://127.0.0.1:5001' || vars.IPFS_PROVIDER || 'http://80.208.229.228:35001' }}
  KUBO_IMAGE: ipfs/kubo:v0.25.0@sha256:9d917826eb669276040efb39cf6c68ae7463356a8e216eb13b278de00aa126be

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # "Release ..." commits tell which versions are published
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Throwaway IPFS node (IPFS_PROVIDER=local only; never released)
        if: vars.IPFS_PROVIDER == 'local'
        run: |
          docker run -d --name ipfs -p 127.0.0.1:5001:5001 "$KUBO_IMAGE" >/dev/null
          for i in $(seq 1 60); do curl -fsS -X POST http://127.0.0.1:5001/api/v0/version >/dev/null 2>&1 && exit 0; sleep 1; done
          docker logs ipfs; exit 1
      - name: Release
        run: node .github/pipeline/release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RPC_TOKEN: ${{ secrets.RPC_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
      - name: Tell the owner if this workflow broke
        if: failure()
        run: node .github/pipeline/report.mjs failure "Release"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PIPELINE_OWNER: ${{ vars.PIPELINE_OWNER }}
      - if: success()
        run: node .github/pipeline/report.mjs success "Release"
        env:
          GITHUB_TOKEN: ${{ github.token }}
