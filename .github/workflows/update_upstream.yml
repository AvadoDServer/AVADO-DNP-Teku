name: Update Teku Upstream Version

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    # Allow manual triggering

jobs:
  # First merge and release an update whose Build passed and whose wait is
  # over (rules: AvadoDServer/ci-release-action/automerge), then look upstream.
  automerge:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: { contents: write, pull-requests: write, actions: read }
    steps:
      - uses: AvadoDServer/ci-release-action/automerge@main
        with:
          rpcToken: ${{ secrets.RPC_TOKEN }}
          enabled: ${{ vars.AUTOMERGE }}
  update-upstream:
    needs: automerge
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run update script
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/update_upstream.py

      - id: cpr
        name: Create Pull Request
        if: env.updated == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update Teku to v${{ env.new_version }}"
          title: "Update Teku from ${{ env.old_version }} to ${{ env.new_version }}"
          body: |
            ## Automated Teku Upstream Update

            This PR updates the Teku upstream version from **${{ env.old_version }}** to **${{ env.new_version }}**.

            ### Changes:
            - Updated `upstream` in `dappnode_package.json` to `${{ env.new_version }}`
            - Incremented `version` in `dappnode_package.json` to `${{ env.package_version }}`
            - Updated `image` tag in `build/docker-compose.yml` to `${{ env.package_version }}`
            - Updated `TEKU_VERSION` build argument in `build/docker-compose.yml` to `${{ env.new_version }}`
            - Updated `image` tag in root `docker-compose.yml` to `${{ env.package_version }}`
            - Updated `TEKU_VERSION` build argument in root `docker-compose.yml` to `${{ env.new_version }}`

            ### Release Notes:
            See [ConsenSys/teku releases](https://github.com/ConsenSys/teku/releases/tag/v${{ env.new_version }})

            cc @flisko
            ---
            *This PR was automatically generated by the update-upstream workflow.*
          branch: update-teku-${{ env.new_version }}
          delete-branch: true
          labels: |
            automated
            dependencies
      # The workflow token starts no pull_request workflow: start the Build here.
      - name: Build the pull request
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          branch=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json headRefName -q .headRefName)
          gh workflow run build.yml -R "$GITHUB_REPOSITORY" --ref "$branch" -f pr="$PR"
