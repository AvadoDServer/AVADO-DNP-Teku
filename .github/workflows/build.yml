name: Build
# Renders every network variant, builds its image for linux/amd64 and proves it
# equals what production boxes run, except for the reviewed differences in
# scripts/proof/expected/ (scripts/prove-equivalence.sh). Uses no secrets and
# publishes nothing.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    name: Manifests (every network)
    runs-on: ubuntu-24.04
    outputs:
      networks: ${{ steps.networks.outputs.networks }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # the proof reads the production release commits
      - id: networks
        run: echo "networks=$(ls package_variants | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
      - run: scripts/prove-equivalence.sh --manifests-only --work "$RUNNER_TEMP/proof"

  images:
    name: Image (${{ matrix.network }})
    needs: manifests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        network: ${{ fromJSON(needs.manifests.outputs.networks) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - run: scripts/prove-equivalence.sh --work "$RUNNER_TEMP/proof" "$NETWORK"
        env:
          NETWORK: ${{ matrix.network }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: proof-${{ matrix.network }}
          path: |
            ${{ runner.temp }}/proof/results.tsv
            ${{ runner.temp }}/proof/${{ matrix.network }}/diff/
            ${{ runner.temp }}/proof/${{ matrix.network }}/production/
            ${{ runner.temp }}/proof/${{ matrix.network }}/candidate/
            ${{ runner.temp }}/proof/${{ matrix.network }}/candidate-build.log
          retention-days: 30
          if-no-files-found: warn
