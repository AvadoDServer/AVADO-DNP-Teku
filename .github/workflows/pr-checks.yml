name: PR checks
# Our own checks for every pull request, per network, on free GitHub-hosted
# runners. The result is ONE commit status on the PR head: "avado/checks".
# The gate (gate.yml) merges the bump bot's PR only when it is green.
#
# Per network: render, AVADOSDK build (the files are added to the IPFS node,
# like ci-build-action did), then on the image loaded back from the uploaded
# file:
#   - the exact Teku version is the one in TEKU_VERSION        scripts/ci/check-version.sh
#   - every option AVADO passes exists in its `teku --help`
#     (hidden --X options: Teku is started with them)           scripts/ci/check-flags.sh
#   - package name, volumes, ports and env keys are unchanged
#     against the base branch and production; versions go up   scripts/ci/check-identity.sh
#   - it boots on its real network with its real command line
#     (checkpoint sync, peers, head moving, no fatal line,
#     every UDP port it listens on and every port it
#     advertises is published)                                  scripts/ci/boot-test.sh
#   - the equivalence proof against what boxes run today        scripts/prove-equivalence.sh
#   - a box upgrades in place: the production image runs on a
#     volume with a test validator key, then this build starts
#     on the same volume and keeps database, settings, the key
#     and its slashing protection                               scripts/ci/upgrade-test.sh
# The tested build's record is kept as artifact
# avado-build-<network>-<content id> (scripts/ci/content-id.sh); release.yml
# publishes exactly that build after the merge, and nothing else.
# Held networks (package_variants/<network>/hold) are not built or tested.
#
# No secrets are used. Started by hand (workflow_dispatch), input "pr" is a PR
# number of THIS repo (the bump bot uses this when it has no PAT_TOKEN), or
# "main" to check the default branch as it is (when Release says there is no
# tested build). PRs from forks are only checked by their own pull_request run,
# whose builds go to a throwaway IPFS node and can never be released.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number of this repo to check, or "main" to check the default branch as it is'
        required: true

permissions:
  contents: read
  pull-requests: read # look up the PR (workflow_dispatch)
  statuses: write

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

env:
  # IPFS API the AVADOSDK adds the build to. Repository variable IPFS_PROVIDER:
  # empty = AVADO's node (as ci-build-action), "local" = a throwaway kubo on
  # the runner (for test copies of this repo; such builds cannot be released).
  # Pull requests from forks always use the throwaway node: release.yml never
  # uses their builds, so nothing is added to AVADO's node for them.
  IPFS_API: ${{ (vars.IPFS_PROVIDER == 'local' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'http://127.0.0.1:5001' || vars.IPFS_PROVIDER || 'http://80.208.229.228:35001' }}
  KUBO_IMAGE: ipfs/kubo:v0.25.0@sha256:9d917826eb669276040efb39cf6c68ae7463356a8e216eb13b278de00aa126be

jobs:
  plan:
    name: Plan (unit tests, identity, manifests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      networks: ${{ steps.networks.outputs.networks }}
      held: ${{ steps.networks.outputs.held }}
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - id: pr
        name: Pull request
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          INPUT_PR: ${{ inputs.pr }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -n "$EVENT_SHA" ]; then
            sha=$EVENT_SHA base=$EVENT_BASE
          elif [ "$INPUT_PR" = main ] || [ "$INPUT_PR" = "$DEFAULT_BRANCH" ]; then
            # The default branch as it is: compared with its previous commit.
            sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)
            base=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha" --jq '.parents[0].sha')
          else
            case "$INPUT_PR" in '' | *[!0-9]*) echo "::error::input pr must be a pull request number or \"main\" (got '$INPUT_PR')"; exit 1 ;; esac
            pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$INPUT_PR")
            head_repo=$(echo "$pr" | jq -r '.head.repo.full_name // empty')
            if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
              # A run started here has this repo's permissions; code from a fork
              # must never run with them (its own pull_request run checks it).
              echo "::error::PR #$INPUT_PR comes from ${head_repo:-a deleted fork}, not from $GITHUB_REPOSITORY. PRs from forks are checked only by their own pull_request run; push the branch to this repo to check it here."
              exit 1
            fi
            sha=$(echo "$pr" | jq -r .head.sha)
            base=$(echo "$pr" | jq -r .base.sha)
          fi
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          echo "base=$base" >>"$GITHUB_OUTPUT"
          echo "Checking $sha against base $base"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 0 # the proof and the identity check read older commits
          persist-credentials: false
      - name: Status avado/checks = pending
        continue-on-error: true # read-only token on pull requests from forks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/${{ steps.pr.outputs.sha }}" -f state=pending -f context=avado/checks \
            -f description="Checks running" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Unit tests of the pipeline rules
        run: node --test ".github/pipeline/test/*.test.mjs"
      - id: networks
        name: Networks (held ones are left out)
        run: |
          nets="" held=""
          for d in package_variants/*/; do
            n=$(basename "$d")
            [ -f "$d/dappnode_package.json" ] || continue
            if [ -f "$d/hold" ]; then
              held="$held $n"
              echo "::notice::$n is HELD, not built or tested: $(sed -n '/^[[:space:]]*#/d; /[^[:space:]]/{p;q;}' "$d/hold")"
            else
              nets="$nets $n"
            fi
          done
          echo "networks=$(printf '%s\n' $nets | jq -R . | jq -sc 'map(select(. != ""))')" >>"$GITHUB_OUTPUT"
          echo "held=$(echo $held)" >>"$GITHUB_OUTPUT"
          echo "Networks checked:${nets:- none}. Held:${held:- none}."
      - name: Teku image digest (Docker Hub)
        run: scripts/ci/check-digest.sh
      - name: Identity (names, volumes, ports, env keys, versions)
        run: |
          rc=0
          for net in $(ls package_variants); do
            echo "::group::$net"
            scripts/ci/check-identity.sh "$net" "${{ steps.pr.outputs.base }}" "$RUNNER_TEMP/identity/$net" || rc=1
            echo "::endgroup::"
          done
          exit $rc
      - name: Equivalence proof (manifests)
        run: scripts/prove-equivalence.sh --manifests-only --work "$RUNNER_TEMP/proof"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checks-plan
          path: |
            ${{ runner.temp }}/identity/
            ${{ runner.temp }}/proof/results.tsv
          retention-days: 30
          if-no-files-found: ignore

  variant:
    name: ${{ matrix.network }}
    needs: plan
    if: needs.plan.outputs.networks != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    # This job runs the pull request's own scripts: it gets no write access.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        network: ${{ fromJSON(needs.plan.outputs.networks) }}
    env:
      NETWORK: ${{ matrix.network }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h / | tail -1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Throwaway IPFS node (test copies and pull requests from forks)
        if: env.IPFS_API == 'http://127.0.0.1:5001'
        run: |
          docker run -d --name ipfs -p 127.0.0.1:5001:5001 "$KUBO_IMAGE" >/dev/null
          for i in $(seq 1 60); do curl -fsS -X POST http://127.0.0.1:5001/api/v0/version >/dev/null 2>&1 && exit 0; sleep 1; done
          docker logs ipfs; exit 1
      - id: build
        name: AVADOSDK build (render, build, add to IPFS)
        run: |
          record=$(scripts/ci/sdk-build.sh "$NETWORK" "$RUNNER_TEMP/checks/build" "$IPFS_API")
          cat "$record"
          echo "image=$(jq -r '.name + ":" + .version' "$record")" >>"$GITHUB_OUTPUT"
          echo "upstream=$(jq -r .upstream "$record")" >>"$GITHUB_OUTPUT"
          echo "content=$(jq -r .contentId "$record")" >>"$GITHUB_OUTPUT"
      - name: Exact Teku version
        if: ${{ !cancelled() && steps.build.outcome == 'success' }} # every check runs, so one run shows every problem
        run: scripts/ci/check-version.sh "${{ steps.build.outputs.image }}" "${{ steps.build.outputs.upstream }}"
      - name: Every option we pass exists in teku --help
        if: ${{ !cancelled() && steps.build.outcome == 'success' }} # every check runs, so one run shows every problem
        run: scripts/ci/check-flags.sh "${{ steps.build.outputs.image }}" "$RUNNER_TEMP/checks/flags"
      - name: Boots on its real network
        if: ${{ !cancelled() && steps.build.outcome == 'success' }} # every check runs, so one run shows every problem
        run: |
          # Exit code 2: only checkpoint sync, peers or the head moving failed
          # (public network, not our package): one more try on a fresh volume.
          rc=0
          scripts/ci/boot-test.sh "${{ steps.build.outputs.image }}" "$RUNNER_TEMP/checks/build/render" "$RUNNER_TEMP/checks/boot" || rc=$?
          if [ "$rc" = 2 ]; then
            echo "::warning::$NETWORK: only network-dependent boot checks failed; trying once more on a fresh volume"
            mv "$RUNNER_TEMP/checks/boot" "$RUNNER_TEMP/checks/boot-try1"
            rc=0
            scripts/ci/boot-test.sh "${{ steps.build.outputs.image }}" "$RUNNER_TEMP/checks/build/render" "$RUNNER_TEMP/checks/boot" || rc=$?
          fi
          exit "$rc"
      - name: Equivalence proof (image)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }} # every check runs, so one run shows every problem
        run: scripts/prove-equivalence.sh --work "$RUNNER_TEMP/checks/proof" --candidate-image "${{ steps.build.outputs.image }}" "$NETWORK"
      - name: Upgrades a box in place (production image, then this build on the same volume)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }} # every check runs, so one run shows every problem
        run: |
          # The proof above loaded the production image and pinned this build by id.
          rc=0
          scripts/ci/upgrade-test.sh "avado-proof/production-$NETWORK:latest" "avado-proof/candidate-$NETWORK:latest" \
            "$RUNNER_TEMP/checks/build/render" "$RUNNER_TEMP/checks/upgrade" || rc=$?
          if [ "$rc" = 2 ]; then
            echo "::warning::$NETWORK: the upgrade test failed only on network-dependent checks; trying once more"
            mv "$RUNNER_TEMP/checks/upgrade" "$RUNNER_TEMP/checks/upgrade-try1"
            rc=0
            scripts/ci/upgrade-test.sh "avado-proof/production-$NETWORK:latest" "avado-proof/candidate-$NETWORK:latest" \
              "$RUNNER_TEMP/checks/build/render" "$RUNNER_TEMP/checks/upgrade" || rc=$?
          fi
          exit "$rc"
      - name: Keep the tested build's record (release.yml publishes exactly this build)
        if: success() # only when every check above passed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avado-build-${{ matrix.network }}-${{ steps.build.outputs.content }}
          path: |
            ${{ runner.temp }}/checks/build/record.json
            ${{ runner.temp }}/checks/build/releases.json
            ${{ runner.temp }}/checks/build/manifest.json
          retention-days: 90
          if-no-files-found: error
      - name: Logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checks-${{ matrix.network }}
          path: |
            ${{ runner.temp }}/checks/build/record.json
            ${{ runner.temp }}/checks/build/sdk-build.log
            ${{ runner.temp }}/checks/flags/
            ${{ runner.temp }}/checks/boot/
            ${{ runner.temp }}/checks/boot-try1/
            ${{ runner.temp }}/checks/upgrade/
            ${{ runner.temp }}/checks/upgrade-try1/
            ${{ runner.temp }}/checks/proof/results.tsv
            ${{ runner.temp }}/checks/proof/${{ matrix.network }}/diff/
            ${{ runner.temp }}/checks/proof/${{ matrix.network }}/production/
            ${{ runner.temp }}/checks/proof/${{ matrix.network }}/candidate/
          retention-days: 30
          if-no-files-found: ignore

  result:
    name: avado/checks
    needs: [plan, variant]
    # not on a cancelled run (a newer push replaced it): its "failure" would
    # overwrite the newer run's "pending" on the same commit
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
      actions: write # starts the gate after a run the bump bot started
    steps:
      - id: status
        name: Status avado/checks
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.plan.outputs.sha || github.event.pull_request.head.sha }}
          INPUT_PR: ${{ inputs.pr }}
          PLAN: ${{ needs.plan.result }}
          VARIANT: ${{ needs.variant.result }}
          NETWORKS: ${{ needs.plan.outputs.networks }}
          HELD: ${{ needs.plan.outputs.held }}
        run: |
          # Even when the plan job failed before it knew the commit, the PR gets a status.
          case "$INPUT_PR" in '' | *[!0-9]*) ;; *) [ -n "$SHA" ] || SHA=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$INPUT_PR" --jq .head.sha || true) ;; esac
          # No network to build (every one is held): the variant job is skipped.
          [ "$NETWORKS" = '[]' ] && [ "$VARIANT" = skipped ] && VARIANT=success
          if [ "$PLAN" = success ] && [ "$VARIANT" = success ]; then
            state=success desc="All checks passed for every network${HELD:+ (held, not checked: $HELD)}"
          else
            state=failure desc="Failed: plan $PLAN, networks $VARIANT (open the run for details)"
          fi
          echo "$state: $desc"
          echo "state=$state" >>"$GITHUB_OUTPUT"
          if [ -n "$SHA" ]; then
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context=avado/checks \
              -f description="$desc" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null ||
              echo "::warning::could not set the avado/checks status (read-only token on a pull request from a fork)"
          fi
      - name: Start the gate
        # A run started with the built-in token (the bump bot without PAT_TOKEN
        # uses workflow_dispatch) does not trigger gate.yml's workflow_run.
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run gate.yml -R "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}" || echo "::warning::could not start the gate; it runs within 4 hours anyway"
      - name: Result
        run: '[ "${{ steps.status.outputs.state }}" = success ]'
