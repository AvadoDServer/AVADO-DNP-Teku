# Base compose, shared by every network. scripts/render.sh merges it with
# package_variants/<network>/docker-compose.yml, renames the service to the
# variant's package name and sets the image to <name>:<version>.
version: '3.4'
services:
  teku:
    build:
      context: ./build
      args:
        # The upstream Teku version of every network. This is the only place
        # it is written: render.sh also copies it into the manifest "upstream".
        TEKU_VERSION: 26.9.0
        # Docker Hub digest of consensys/teku:<TEKU_VERSION>. The image is built
        # FROM version@digest, so a moved tag cannot change a package. The bump
        # bot writes both lines together.
        TEKU_DIGEST: sha256:6bfef491dc2714b8c4ed4af2c05decb78b2058d77dad50a3fb2d3df167b5fde6
    volumes:
      - 'data:/data'
    environment:
      - JAVA_OPTS=-Xmx8g
      - EXTRA_OPTS=
volumes:
  data: {}
